<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Glassline Racing HUD</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="hud" aria-label="Racing HUD">
      <section class="gauge">
        <div class="ring"></div>
        <div class="arc arc-speed"></div>
        <div class="arc arc-rpm"></div>
        <div class="speed"><span id="speed">0</span><small>km/h</small></div>
        <div class="gear" id="gear">N</div>
        <div class="rpm"><span id="rpm">750</span><small>rpm</small></div>
        <div class="assist left">TCS</div>
        <div class="assist right">ABS</div>
        <div class="fuel"><span id="fuel"></span></div>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
